services:
  - type: web
    name: creatormarket-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/jobs/
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: creatormarket-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://creatormarket-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://creatormarket-web.onrender.com

  - type: web
    name: creatormarket-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: VITE_API_URL
        value: https://creatormarket-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
